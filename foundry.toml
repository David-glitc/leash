[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
qorechain_testnet = "https://evm-testnet.qore.host"

[invariant]
runs = 256
depth = 60
fail_on_revert = false
